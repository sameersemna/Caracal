# /etc/systemd/system/whisper-server.service.d/override.conf
# Hardening after the 2026-11-21 outage: a Kilo agent in another project (GraphQS) ran a buggy
# `ss -ltnp | grep -oP 'pid=...' | xargs kill` that SIGTERMed every listening process owned by
# `sameer`, whisper included. A SIGTERM exit counts as "success", so Restart=on-failure left it down.

[Unit]
# Never give up restarting, however often it dies.
StartLimitIntervalSec=0
Wants=network-online.target
After=network-online.target

[Service]
# Restart on ANY exit: crash, OOM kill, SIGTERM/SIGKILL from another process, clean exit.
# (`systemctl stop` is still honoured; the watchdog timer then starts it again.)
Restart=always
RestartSec=3

# Run under its own throw-away uid instead of `sameer`, so scripts and AI agents running as
# sameer get EPERM if they try to kill it. Verified: the server needs no home dir and no
# writable cwd; the model (0664) and /dev/nvidia* (0666) are readable by any uid.
User=
DynamicUser=yes
SupplementaryGroups=video render
CacheDirectory=whisper
Environment=CUDA_CACHE_PATH=/var/cache/whisper

# Last thing the kernel OOM killer should pick.
OOMScoreAdjust=-900
TimeoutStopSec=20
