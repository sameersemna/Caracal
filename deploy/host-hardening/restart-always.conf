# restart-always.conf — drop-in for long-running host services.
# Restart on ANY exit (crash, OOM, SIGTERM/SIGKILL from another process such as the 2026-11-21
# Kilo mass-kill) and never give up. `systemctl stop` is still honoured.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
