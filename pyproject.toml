[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caracal"
version = "0.1.0"
description = "Caracal — audio intelligence API and MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "curl-cffi==0.17.0",
    "fastapi==0.162.7",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "pgvector==0.5.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.33",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn[standard]==0.54.0",
    "yt-dlp==2026.10.26",
    "yt-dlp-ejs==0.8.0",
]

[project.optional-dependencies]
speakers = [
    "pyannote.audio==4.0.7",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchcodec",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }

[project.scripts]
caracal = "caracal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caracal"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs real services (never run by the gate)"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "fakeredis[lua]==2.40.0",
    "linkify-it-py==2.0.3",
    "markdown-it-py==3.0.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]
